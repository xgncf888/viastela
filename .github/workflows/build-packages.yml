name: Build All-Platform Packages

# Publishes prebuilt Web PWA, Charioteer Plugin, and macOS packages (.zip + .dmg built on macos-latest)
# directly to GitHub Releases (`latest`) without fragile cloud npm registry dependencies.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - gemini/ui-refinement
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: build-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-dmg:
    name: Build macOS .dmg Installer
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build .dmg from signed macOS bundle
        run: |
          mkdir -p dmg-stage release-out
          ditto -x -k releases/viastela-macos.zip dmg-stage
          ln -s /Applications dmg-stage/Applications
          APP_NAME=$(ls -d dmg-stage/*.app | head -n 1 | xargs basename -s .app)
          hdiutil create -volname "$APP_NAME" -srcfolder dmg-stage -ov -format UDZO release-out/viastela-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: viastela-macos-dmg
          path: release-out/viastela-macos.dmg
          if-no-files-found: error

  publish-release:
    name: Publish to GitHub Releases
    needs:
      - macos-dmg
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
        continue-on-error: true
      - name: Collect all release packages & checksums
        run: |
          mkdir -p release-assets
          cp releases/*.zip release-assets/
          cd release-assets
          sha256sum *.zip *.dmg 2>/dev/null > SHA256SUMS.txt || sha256sum *.zip > SHA256SUMS.txt
      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest Multi-Platform Release' }}
          body: |
            ### Direct Download Packages (`${{ github.sha }}`)
            - **`viastela-macos.dmg`**: macOS disk image installer (drag to Applications)
            - **`viastela-macos.zip`**: macOS native desktop application bundle (`.app`)
            - **`viastela-web-pwa.zip`**: Standalone Web & mobile PWA bundle
            - **`viastela-charioteer-plugin.zip`**: Charioteer v1.0 Perspective plugin (`@charioteer/viastela`)
            - **`SHA256SUMS.txt`**: SHA-256 checksums for all archives
          prerelease: false
          make_latest: true
          files: release-assets/*
