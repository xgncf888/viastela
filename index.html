<!DOCTYPE html>
<html lang="zh-Hans" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>星途</title>
    <style id="expo-reset">
      * {
        -webkit-tap-highlight-color: transparent;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background-color: #FAF9F5;
        color: #141413;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", system-ui, sans-serif;
      }
      body {
        overflow: hidden;
        background-color: #FAF9F5;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
        background-color: #FAF9F5;
      }
      [data-theme="dark"] html,
      [data-theme="dark"] body,
      [data-theme="dark"] #root {
        background-color: #121318 !important;
        color: #F4F3EF !important;
      }
      .vs-boot-shell {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .vs-boot-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding: 24px 28px;
        border-radius: 18px;
        background: #FFFFFF;
        border: 1px solid rgba(217, 119, 87, 0.24);
        box-shadow: 0 16px 40px rgba(20, 20, 19, 0.08);
      }
      [data-theme="dark"] .vs-boot-card {
        background: #1A1C23;
        border-color: rgba(245, 185, 66, 0.28);
        box-shadow: 0 20px 48px rgba(0, 0, 0, 0.55);
      }
      .vs-boot-ring {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: #141413;
        color: #F5B942;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        font-weight: 700;
        border: 1.5px solid rgba(245, 185, 66, 0.65);
      }
      .vs-boot-title {
        font-size: 16px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .vs-boot-sub {
        font-size: 12px;
        color: #73726C;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div class="vs-boot-shell">
        <div class="vs-boot-card">
          <div class="vs-boot-ring">✦</div>
          <div class="vs-boot-title">星途</div>
          <div class="vs-boot-sub">正在打开今日主场…</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
